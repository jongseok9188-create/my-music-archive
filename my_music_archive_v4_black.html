<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080808">
<title>My Music Archive</title>
<style>
:root{--bg:#080808;--panel:#151515;--panel2:#202020;--line:#303030;--text:#f2f2f2;--muted:#a0a0a0;--black:#fff;--gray:#777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.015em}
header{padding:22px max(20px,calc((100% - 1160px)/2));border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;background:#101010}
.brand{font-weight:850;letter-spacing:.16em;font-size:14px}.brand span{color:#777}.sub{color:var(--muted);font-size:12px;margin-top:5px}
button,.btn{border:1px solid #3a3a3a;background:#1b1b1b;color:var(--text);padding:10px 14px;border-radius:7px;cursor:pointer;font:inherit;transition:background .15s,border-color .15s}
button.primary{background:#f0f0f0;color:#111;border:1px solid #f0f0f0;font-weight:650}button:hover{background:#303030}button.primary:hover{background:#d2d2d2}
main{max-width:1160px;margin:30px auto;padding:0 20px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:#151515;border:1px solid var(--line);border-radius:10px;padding:17px 18px}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:27px;font-weight:650;margin-top:5px;letter-spacing:-.04em}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:25px 0 17px}.toolbar input,.toolbar select,.field input,.field textarea,.field select{background:#202020;color:var(--text);border:1px solid #3a3a3a;border-radius:7px;padding:11px;font:inherit;min-width:0}.toolbar input{flex:1;min-width:180px}.toolbar input:focus,.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #777;outline-offset:1px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:25px 0 13px}.section-head h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.03em}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:17px}
.album{background:#151515;border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;transition:transform .16s,border-color .16s}.album:hover{transform:translateY(-3px);border-color:#777}.cover{aspect-ratio:1;background:#242424;display:grid;place-items:center;color:#777;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover .placeholder{font-size:38px}.album-info{padding:12px}.album-title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}.rating{color:#f2f2f2;font-weight:650}
.empty{padding:42px;text-align:center;color:var(--muted);border:1px dashed #c8c8c4;border-radius:9px;background:#101010}
dialog{background:#101010;color:var(--text);border:1px solid #cfcfca;border-radius:12px;width:min(620px,calc(100% - 24px));padding:0;box-shadow:0 20px 70px #0002}dialog::backdrop{background:#000b;backdrop-filter:blur(3px)}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:#171717}.modal-body{padding:22px;display:grid;grid-template-columns:130px 1fr;gap:20px}.modal-cover{width:130px;aspect-ratio:1;border-radius:7px;object-fit:cover;background:#242424}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select{width:100%}.field.full{grid-column:1/-1}.field textarea{min-height:90px;resize:vertical}.modal-actions{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.danger{color:#8b2525}.search-results{grid-column:1/-1;display:grid;gap:8px}.search-result{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px;background:#202020}.search-result img{width:48px;height:48px;object-fit:cover;border-radius:4px;flex:none}.search-result small{display:block;color:var(--muted);font-size:11px}.search-status{grid-column:1/-1;color:var(--muted);font-size:12px}.notice{margin-top:20px;padding:12px 14px;background:#191919;border:1px solid #333;border-radius:8px;color:#aaa;font-size:12px}

.detail-dialog{width:min(760px,calc(100% - 24px));max-height:90vh;overflow:auto}
.detail-top{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:24px;padding:26px}
.detail-cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;background:#242424}
.detail-cover-placeholder{width:100%;aspect-ratio:1;border-radius:9px;background:#242424;display:grid;place-items:center;color:#777;font-size:54px}
.detail-heading{align-self:center;min-width:0}
.detail-heading h2{font-size:clamp(22px,4vw,32px);line-height:1.2;margin:0 0 8px;overflow-wrap:anywhere}
.detail-heading .detail-artist{font-size:16px;color:#aaa;margin-bottom:15px}
.detail-rating{font-size:14px;font-weight:700;margin-bottom:8px}
.detail-facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:0 26px 22px}
.detail-fact{background:#191919;border:1px solid #303030;border-radius:8px;padding:12px}
.detail-fact small{display:block;color:#999;font-size:11px;margin-bottom:4px}
.detail-fact strong{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.detail-review{margin:0 26px 24px;padding:17px;background:#191919;border:1px solid #303030;border-radius:8px}
.detail-review h3{font-size:13px;margin:0 0 9px;color:#aaa}
.detail-review p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75}
.detail-actions{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
@media(max-width:560px){
 .detail-top{grid-template-columns:112px 1fr;gap:15px;padding:18px}
 .detail-heading h2{font-size:20px}
 .detail-heading .detail-artist{font-size:13px;margin-bottom:9px}
 .detail-facts{padding:0 18px 18px;gap:8px}
 .detail-fact{padding:10px}
 .detail-review{margin:0 18px 18px;padding:14px}
 .detail-actions{padding:13px 18px}
}

@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat strong{font-size:24px}.modal-body{grid-template-columns:1fr}.modal-cover{width:110px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}header{padding:17px 18px}main{margin:22px auto;padding:0 15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.album-info{padding:9px}.album-title{font-size:13px}.artist{font-size:11px}.toolbar{gap:7px}.toolbar input{min-width:100%;}}
</style>
</head>
<body>
<header><div><div class="brand">MY MUSIC <span>ARCHIVE</span></div><div class="sub">나만의 음악 청취 기록 · 앨범 컬렉션</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button id="exportBtn">백업 내보내기</button><button id="importBtn">백업 가져오기</button><button class="primary" id="addBtn">＋ 앨범 추가</button><input id="importFile" type="file" accept="application/json" hidden></div></header>
<main>
<div class="stats">
 <div class="stat"><small>등록 앨범</small><strong id="albumCount">0</strong></div>
 <div class="stat"><small>총 감상 횟수</small><strong id="playCount">0</strong></div>
 <div class="stat"><small>평가한 앨범</small><strong id="ratedCount">0</strong></div>
 <div class="stat"><small>평균 평점</small><strong id="avgRating">—</strong></div>
</div>
<div class="toolbar"><input id="search" placeholder="앨범명·아티스트·장르 검색"><select id="artistFilter" aria-label="아티스트별 보기"><option value="all">모든 아티스트</option></select><select id="genreFilter" aria-label="장르별 보기"><option value="all">모든 장르</option></select><select id="sort"><option value="recent">최근 감상순</option><option value="oldest">오래된 감상순</option><option value="rating">평점 높은순</option><option value="plays">감상 횟수순</option><option value="title">앨범명순</option><option value="year">발매 연도순</option></select><select id="filter"><option value="all">전체 앨범</option><option value="rated">평가한 앨범</option><option value="unrated">미평가 앨범</option></select></div>
<div class="section-head"><h2>앨범 라이브러리</h2><span class="muted" id="shownCount"></span></div>
<div class="grid" id="albums"></div>
<div class="notice">현재 버전은 브라우저에 데이터를 저장하는 개인용 프로토타입입니다. 다른 기기와 자동 동기화하려면 다음 단계에서 Supabase 클라우드 연결이 필요합니다. 브라우저 데이터를 삭제하기 전에 백업을 내보내세요.</div>
</main>
<dialog id="albumDialog">
 <div class="modal-head"><strong id="dialogTitle">앨범 추가</strong><button id="closeDialog">✕</button></div>
 <form id="albumForm">
  <div class="modal-body"><img id="preview" class="modal-cover" alt="앨범 커버 미리보기"><div class="fields">
   <div class="field full"><label>앨범명 *</label><input name="title" required maxlength="180" placeholder="예: Blonde"></div>
   <div class="field full"><label>아티스트 *</label><input name="artist" required maxlength="180" placeholder="예: Frank Ocean"></div>
   <div class="field full"><button type="button" id="lookupBtn">앨범 정보 자동 검색</button><div id="lookupResults" class="search-results" aria-live="polite"></div></div>
   <div class="field"><label>발매 연도</label><input name="releaseYear" type="number" min="1900" max="2100" step="1" placeholder="예: 2016"></div>
   <div class="field"><label>발매일 (선택)</label><input name="releaseDate" type="date"></div>
   <div class="field"><label>장르</label><input name="genre" placeholder="예: Alternative R&B"></div>
   <div class="field"><label>내 평점 (5점 만점)</label><input name="rating" type="number" min="0" max="5" step="0.1" placeholder="비워두면 미평가"></div>
   <div class="field"><label>수록곡 수</label><input name="tracks" type="number" min="0" step="1" placeholder="예: 17"></div>
   <div class="field"><label>감상 횟수</label><input name="plays" type="number" min="0" step="1" value="1"></div>
   <div class="field"><label>최근 감상일</label><input name="lastListened" type="date"></div>
   <div class="field full"><label>앨범 커버 이미지 URL</label><input name="cover" type="url" placeholder="https://..."></div>
   <div class="field full"><label>감상평</label><textarea name="review" placeholder="이 앨범에 대한 생각을 기록해 보세요."></textarea></div>
  </div></div>
  <div class="modal-actions"><button type="button" class="danger" id="deleteBtn" hidden>앨범 삭제</button><div style="margin-left:auto;display:flex;gap:8px"><button type="button" id="cancelBtn">취소</button><button class="primary" type="submit">저장</button></div></div>
 </form>
</dialog>

<dialog id="detailDialog" class="detail-dialog">
 <div class="modal-head"><strong>앨범 상세</strong><button type="button" id="closeDetail">✕</button></div>
 <div id="detailContent"></div>
 <div class="detail-actions"><button type="button" class="danger" id="detailDelete">앨범 삭제</button><div style="margin-left:auto;display:flex;gap:8px"><button type="button" id="detailEdit" class="primary">앨범 수정</button></div></div>
</dialog>
<script>
const KEY='my-music-archive-v1';
let data=JSON.parse(localStorage.getItem(KEY)||'[]'), editing=null;
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 $('#albumCount').textContent=data.length.toLocaleString();
 $('#playCount').textContent=data.reduce((n,a)=>n+(Number(a.plays)||0),0).toLocaleString();
 const rated=data.filter(a=>a.rating!==''&&a.rating!=null&&Number.isFinite(Number(a.rating)));
 $('#ratedCount').textContent=rated.length.toLocaleString();
 $('#avgRating').textContent=rated.length?(rated.reduce((n,a)=>n+Number(a.rating),0)/rated.length).toFixed(1)+'/5':'—';
 const artistSelect=$('#artistFilter'), genreSelect=$('#genreFilter');
 const oldArtist=artistSelect.value||'all', oldGenre=genreSelect.value||'all';
 const artists=[...new Set(data.map(a=>(a.artist||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
 const genres=[...new Set(data.map(a=>(a.genre||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
 artistSelect.innerHTML='<option value="all">모든 아티스트</option>'+artists.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 genreSelect.innerHTML='<option value="all">모든 장르</option>'+genres.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 artistSelect.value=artists.includes(oldArtist)?oldArtist:'all'; genreSelect.value=genres.includes(oldGenre)?oldGenre:'all';
 const q=$('#search').value.trim().toLocaleLowerCase('ko'), f=$('#filter').value, sort=$('#sort').value;
 const selectedArtist=artistSelect.value, selectedGenre=genreSelect.value;
 let list=data.filter(a=>(a.title+' '+a.artist+' '+(a.genre||'')).toLocaleLowerCase('ko').includes(q));
 if(selectedArtist!=='all')list=list.filter(a=>(a.artist||'').trim()===selectedArtist);
 if(selectedGenre!=='all')list=list.filter(a=>(a.genre||'').trim()===selectedGenre);
 if(f==='rated')list=list.filter(a=>a.rating!==''&&a.rating!=null);
 if(f==='unrated')list=list.filter(a=>a.rating===''||a.rating==null);
 list.sort((a,b)=>sort==='rating'?(Number(b.rating)||0)-(Number(a.rating)||0):sort==='plays'?(Number(b.plays)||0)-(Number(a.plays)||0):sort==='title'?(a.title||'').localeCompare(b.title||'','ko'):sort==='year'?(Number(b.releaseYear||String(b.releaseDate||'').slice(0,4))||0)-(Number(a.releaseYear||String(a.releaseDate||'').slice(0,4))||0):sort==='oldest'?String(a.lastListened||a.createdAt||'').localeCompare(String(b.lastListened||b.createdAt||'')):String(b.lastListened||b.createdAt||'').localeCompare(String(a.lastListened||a.createdAt||'')));
 $('#shownCount').textContent=list.length+'개 표시';
 $('#albums').innerHTML=list.length?list.map(a=>`<article class="album" data-id="${a.id}"><div class="cover">${a.cover?`<img src="${esc(a.cover)}" alt="" onerror="this.remove()">`:'<span class="placeholder">♫</span>'}</div><div class="album-info"><div class="album-title">${esc(a.title)}</div><div class="artist">${esc(a.artist)}</div><div class="artist">${esc(a.releaseYear||((a.releaseDate||'').slice(0,4))||'발매 연도 미등록')} · ${esc(a.genre||'장르 미등록')}</div><div class="meta"><span class="rating">${a.rating!==''&&a.rating!=null?'★ '+Number(a.rating).toFixed(1):'미평가'}</span><span>${Number(a.plays)||0}회 감상</span></div></div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">조건에 맞는 앨범이 없어.</div>';
}

let detailAlbumId=null;
function openDetail(item){
 if(!item)return;
 detailAlbumId=item.id;
 const cover=item.cover
  ? `<img class="detail-cover" src="${esc(item.cover)}" alt="${esc(item.title)} 앨범 커버" onerror="this.outerHTML='<div class=&quot;detail-cover-placeholder&quot;>♫</div>'">`
  : '<div class="detail-cover-placeholder">♫</div>';
 const year=item.releaseYear||String(item.releaseDate||'').slice(0,4)||'미등록';
 const rating=item.rating!==''&&item.rating!=null&&Number.isFinite(Number(item.rating))
  ? `★ ${Number(item.rating).toFixed(1)} / 5` : '아직 평가하지 않았어';
 const fact=(label,value)=>`<div class="detail-fact"><small>${label}</small><strong>${esc(value||'미등록')}</strong></div>`;
 $('#detailContent').innerHTML=`
  <div class="detail-top">${cover}<div class="detail-heading">
   <h2>${esc(item.title||'제목 없음')}</h2>
   <div class="detail-artist">${esc(item.artist||'아티스트 미등록')}</div>
   <div class="detail-rating">${rating}</div>
   <div class="muted">${esc(year)} · ${esc(item.genre||'장르 미등록')}</div>
  </div></div>
  <div class="detail-facts">
   ${fact('발매일',item.releaseDate||year)}
   ${fact('장르',item.genre)}
   ${fact('수록곡 수',item.tracks!==''&&item.tracks!=null?`${Number(item.tracks)||0}곡`:'미등록')}
   ${fact('감상 횟수',`${Number(item.plays)||0}회`)}
   ${fact('최근 감상일',item.lastListened||'미등록')}
   ${fact('내 평점',rating)}
  </div>
  <section class="detail-review"><h3>감상평</h3><p>${esc(item.review||'아직 작성한 감상평이 없어.')}</p></section>`;
 $('#detailDialog').showModal();
}
$('#closeDetail').onclick=()=>$('#detailDialog').close();
$('#detailEdit').onclick=()=>{
 const item=data.find(a=>a.id===detailAlbumId);
 $('#detailDialog').close();
 if(item)openEditor(item);
};
$('#detailDelete').onclick=()=>{
 if(!detailAlbumId)return;
 const item=data.find(a=>a.id===detailAlbumId);
 if(item&&confirm(`'${item.title}' 앨범 기록을 삭제할까?`)){
  data=data.filter(a=>a.id!==detailAlbumId);
  save();$('#detailDialog').close();detailAlbumId=null;
 }
};

function openEditor(item=null){
 editing=item?.id||null;$('#dialogTitle').textContent=item?'앨범 정보 수정':'앨범 추가';$('#deleteBtn').hidden=!item;
 const form=$('#albumForm');form.reset();const vals=item||{plays:1,lastListened:today()};
 for(const [k,v] of Object.entries(vals))if(form.elements[k])form.elements[k].value=v??'';
 $('#preview').src=item?.cover||'';$('#preview').style.visibility=item?.cover?'visible':'hidden';$('#lookupResults').innerHTML='';
 $('#albumDialog').showModal();
}
$('#addBtn').onclick=()=>openEditor();$('#closeDialog').onclick=$('#cancelBtn').onclick=()=>$('#albumDialog').close();
// Search album metadata and artwork through Apple's public iTunes Search API.
function normalizeMusicText(value='') {
 return String(value).normalize('NFKC').toLocaleLowerCase('en')
  .replace(/[’'`]/g, '').replace(/[^\p{L}\p{N}]+/gu, ' ').trim().replace(/\s+/g, ' ');
}
function artistAliases(value='') {
 const n = normalizeMusicText(value);
 const aliases = {
  '씨잼': ['c jamm', 'c-jamm', 'cjam m', '씨잼'],
  'c jamm': ['c jamm', 'c-jamm', '씨잼'],
  '더콰이엇': ['the quiett', 'the quiett'],
  '빈지노': ['beenzino'],
  '이센스': ['e sens', 'e-sens'],
  '비와이': ['bewhy', '비와이'],
  '창모': ['changmo', '창모']
 };
 return [...new Set([n, ...(aliases[n] || [])].filter(Boolean))];
}
function searchAppleAlbums(term, country) {
 return new Promise((resolve, reject) => {
  const callback = 'itunes_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
  const params = new URLSearchParams({term, country, media:'music', entity:'album', limit:'50', callback});
  const script = document.createElement('script');
  let finished = false;
  const cleanup = () => {
   if (finished) return;
   finished = true; clearTimeout(timer);
   try { delete window[callback]; } catch (_) { window[callback] = undefined; }
   script.remove();
  };
  const timer = setTimeout(() => { cleanup(); reject(new Error('검색 시간 초과')); }, 10000);
  window[callback] = payload => { cleanup(); resolve(payload && Array.isArray(payload.results) ? payload.results : []); };
  script.onerror = () => { cleanup(); reject(new Error('검색 서버 연결 실패')); };
  script.src = 'https://itunes.apple.com/search?' + params.toString();
  document.head.appendChild(script);
 });
}
$('#lookupBtn').onclick = async () => {
 const form = $('#albumForm');
 const title = form.elements.title.value.trim();
 const artist = form.elements.artist.value.trim();
 const box = $('#lookupResults');
 if (!title || !artist) {
  box.innerHTML = '<div class="search-status">앨범명과 아티스트를 모두 입력해 줘.</div>';
  return;
 }
 box.innerHTML = '<div class="search-status">입력한 앨범명과 아티스트가 일치하는 결과만 찾고 있어…</div>';
 const wantedTitle = normalizeMusicText(title);
 const wantedArtists = artistAliases(artist);
 const artistSearch = wantedArtists.filter(x => x.length >= 2);
 const queries = [...new Set([
  `${title} ${artistSearch[1] || artistSearch[0]}`,
  ...artistSearch,
  title
 ].filter(Boolean))];
 const countries = ['US', 'GB', 'KR', 'CA', 'AU'];
 const found = new Map();
 try {
  for (const term of queries) {
   for (const country of countries) {
    let results = [];
    try { results = await searchAppleAlbums(term, country); } catch (_) { continue; }
    for (const item of results) {
     if (!item.collectionName || !item.artistName) continue;
     const gotArtist = normalizeMusicText(item.artistName);
     const gotTitle = normalizeMusicText(item.collectionName);
     const artistMatch = wantedArtists.some(a => a && (gotArtist === a || gotArtist.includes(a) || a.includes(gotArtist)));
     const titleMatch = gotTitle === wantedTitle || gotTitle.includes(wantedTitle) || wantedTitle.includes(gotTitle);
     // Avoid unrelated results: both artist and album title must match.
     if (!artistMatch || !titleMatch) continue;
     const key = String(item.collectionId || `${gotTitle}|${gotArtist}`);
     const score = (gotArtist === wantedArtists[0] ? 4 : 0) + (gotTitle === wantedTitle ? 5 : 0) + (item.collectionType === 'Album' ? 1 : 0);
     const old = found.get(key);
     if (!old || score > old.score) found.set(key, {item, score});
    }
   }
  }
  const matches = [...found.values()].sort((a,b) => b.score-a.score).map(x=>x.item).slice(0,15);
  if (!matches.length) {
   box.innerHTML = '<div class="search-status">정확히 일치하는 앨범을 찾지 못했어. 한글·영문 표기를 바꿔 검색해 봐. 엉뚱한 결과는 표시하지 않도록 했어.</div>';
   return;
  }
  box._matches = matches;
  box.innerHTML = matches.map((item, i) => {
   const cover = (item.artworkUrl100 || '').replace('100x100bb', '600x600bb');
   return `<button type="button" class="search-result" data-result="${i}"><img src="${esc(cover)}" alt=""><span><strong>${esc(item.collectionName)}</strong><small>${esc(item.artistName)} · ${(item.releaseDate || '').slice(0,4) || '연도 정보 없음'} · ${esc(item.primaryGenreName || '장르 정보 없음')}</small></span></button>`;
  }).join('');
 } catch (_) {
  box.innerHTML = '<div class="search-status">검색 서버에 연결하지 못했어. 인터넷 연결을 확인해 줘.</div>';
 }
};
$('#lookupResults').onclick=e=>{const btn=e.target.closest('[data-result]');if(!btn)return;const x=$('#lookupResults')._matches?.[Number(btn.dataset.result)];if(!x)return;const form=$('#albumForm');const cover=(x.artworkUrl100||'').replace('100x100bb','600x600bb');form.elements.title.value=x.collectionName||form.elements.title.value;form.elements.artist.value=x.artistName||form.elements.artist.value;if(x.releaseDate){form.elements.releaseDate.value=x.releaseDate.slice(0,10);form.elements.releaseYear.value=x.releaseDate.slice(0,4)}if(x.primaryGenreName)form.elements.genre.value=x.primaryGenreName;if(x.trackCount)form.elements.tracks.value=x.trackCount;if(cover){form.elements.cover.value=cover;$('#preview').src=cover;$('#preview').style.visibility='visible'}$('#lookupResults').innerHTML='<div class="search-status">앨범 정보를 입력했어. 확인한 뒤 저장해 줘.</div>'};
$('#albumForm').onsubmit=e=>{e.preventDefault();const fd=new FormData(e.target),obj=Object.fromEntries(fd.entries());obj.rating=obj.rating===''?'':Number(obj.rating);obj.plays=Math.max(0,Number(obj.plays)||0);obj.tracks=Math.max(0,Number(obj.tracks)||0);obj.releaseYear=obj.releaseYear?String(Math.max(1900,Math.min(2100,Number(obj.releaseYear)||1900))):'';
 if(editing){const i=data.findIndex(x=>x.id===editing);data[i]={...data[i],...obj,updatedAt:new Date().toISOString()}}
 else data.unshift({...obj,id:crypto.randomUUID(),createdAt:new Date().toISOString()});
 save();$('#albumDialog').close()};
$('#deleteBtn').onclick=()=>{if(editing&&confirm('이 앨범 기록을 삭제할까?')){data=data.filter(a=>a.id!==editing);save();$('#albumDialog').close()}};
$('#albums').onclick=e=>{const card=e.target.closest('[data-id]');if(card)openDetail(data.find(a=>a.id===card.dataset.id))};
$('#preview').onerror=()=>{$('#preview').style.visibility='hidden'};$('#albumForm').elements.cover.oninput=e=>{const v=e.target.value;$('#preview').src=v;$('#preview').style.visibility=v?'visible':'hidden'};
['search','sort','filter','artistFilter','genreFilter'].forEach(id=>$('#'+id).addEventListener(id==='search'?'input':'change',render));
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),albums:data},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-music-archive-backup.json';a.click();URL.revokeObjectURL(a.href)};
$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text()),incoming=Array.isArray(obj)?obj:obj.albums;if(!Array.isArray(incoming))throw Error();if(confirm(`${incoming.length}개 앨범을 가져올까? 기존 기록과 합쳐져.`)){const ids=new Set(data.map(a=>a.id));for(const a of incoming){if(!a.id||ids.has(a.id))a.id=crypto.randomUUID();data.push(a);ids.add(a.id)}save()}}catch{alert('올바른 백업 파일이 아니야.')}e.target.value=''};
render();
</script>
</body></html>
